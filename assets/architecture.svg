<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc"><title id="title">Andaith architecture</title><desc id="desc">External agents call MCP. CLI and MCP invoke domain rules. A scheduler uses a clock and the domain. SQLite persists state. Notification adapters and incoming check-ins connect to the domain.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#b9cbad" stroke-width="1.3"/></marker></defs><rect width="1120" height="540" rx="8" fill="#172b27"/><g font-family="system-ui,sans-serif"><text x="42" y="44" font-size="13" fill="#cce57b" letter-spacing="2">ANDAITH / COMPONENT BOUNDARIES</text><rect x="42" y="83" width="235" height="72" rx="5" fill="#213b33" stroke="#496052"/><text x="60" y="114" font-size="20" fill="#f4f2e9">External agent routines</text><text x="60" y="137" font-size="13" fill="#bdcbbd">Research outside Andaith</text><rect x="42" y="210" width="235" height="72" rx="5" fill="#213b33" stroke="#496052"/><text x="60" y="241" font-size="20" fill="#f4f2e9">CLI + MCP</text><text x="60" y="264" font-size="13" fill="#bdcbbd">Shared use cases</text><rect x="348" y="210" width="360" height="100" rx="5" fill="#cce57b" stroke="#cce57b"/><text x="366" y="241" font-size="20" fill="#172b27">Domain rules</text><text x="366" y="264" font-size="13" fill="#314638">Plans · check-ins · recorded activity</text><rect x="798" y="210" width="275" height="100" rx="5" fill="#213b33" stroke="#496052"/><text x="816" y="241" font-size="20" fill="#f4f2e9">SQLite</text><text x="816" y="264" font-size="13" fill="#bdcbbd">Embedded migrations + ledger</text><rect x="348" y="83" width="180" height="72" rx="5" fill="#213b33" stroke="#496052"/><text x="366" y="114" font-size="20" fill="#f4f2e9">Clock</text><text x="366" y="137" font-size="13" fill="#bdcbbd">Injectable</text><rect x="563" y="83" width="180" height="72" rx="5" fill="#213b33" stroke="#496052"/><text x="581" y="114" font-size="20" fill="#f4f2e9">Scheduler</text><text x="581" y="137" font-size="13" fill="#bdcbbd">Evaluates due events</text><rect x="348" y="397" width="250" height="78" rx="5" fill="#213b33" stroke="#496052"/><text x="366" y="428" font-size="20" fill="#f4f2e9">Notification adapters</text><text x="366" y="451" font-size="13" fill="#bdcbbd">Telegram / simulated in demo</text><rect x="798" y="397" width="275" height="78" rx="5" fill="#213b33" stroke="#496052"/><text x="816" y="428" font-size="20" fill="#f4f2e9">Incoming check-ins</text><text x="816" y="451" font-size="13" fill="#bdcbbd">Transport → domain</text><path d="M159 155 V210" fill="none" stroke="#b9cbad" stroke-width="2" marker-end="url(#arrow)"/><path d="M277 248 H348" fill="none" stroke="#b9cbad" stroke-width="2" marker-end="url(#arrow)"/><path d="M708 260 H798" fill="none" stroke="#b9cbad" stroke-width="2" marker-end="url(#arrow)"/><path d="M528 120 H563" fill="none" stroke="#b9cbad" stroke-width="2" marker-end="url(#arrow)"/><path d="M653 155 V210" fill="none" stroke="#b9cbad" stroke-width="2" marker-end="url(#arrow)"/><path d="M473 310 V397" fill="none" stroke="#b9cbad" stroke-width="2" marker-end="url(#arrow)"/><path d="M935 397 V348 H674 V310" fill="none" stroke="#b9cbad" stroke-width="2" marker-end="url(#arrow)"/><text x="42" y="516" font-size="13" fill="#bdcbbd">Conceptual component view. No personal infrastructure, addresses, or account details.</text></g></svg>